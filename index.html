<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>記帳 Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #000;
    --card: #141414;
    --border: #222;
    --text: #f0f0f0;
    --muted: #777;
    --green: #4ade80;
    --red: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 1.25rem;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.25rem;
    flex-wrap: wrap;
    gap: 0.75rem;
  }
  h1 { font-size: 1.4rem; font-weight: 600; }
  .status { font-size: 0.8rem; color: var(--muted); }
  .status.ok { color: var(--green); }
  .controls { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
  button, select {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 0.4rem 0.75rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  button:hover { background: #1f1f1f; }
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 0.75rem;
    margin-bottom: 1rem;
  }
  .kpi {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.9rem;
  }
  .kpi-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; }
  .kpi-value { font-size: 1.4rem; font-weight: 700; margin: 0.2rem 0; }
  .kpi-sub { font-size: 0.7rem; color: var(--muted); }
  .pos { color: var(--green); }
  .neg { color: var(--red); }
  .charts-grid {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 0.75rem;
    margin-bottom: 1rem;
  }
  @media (max-width: 900px) { .charts-grid { grid-template-columns: 1fr; } }
  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem;
  }
  .panel h2 { font-size: 0.9rem; margin-bottom: 0.6rem; }
  canvas { max-height: 240px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
  th, td { padding: 0.5rem 0.6rem; text-align: center; border-bottom: 1px solid var(--border); }
  th { background: #0d0d0d; color: var(--muted); font-weight: 500; }
  td:first-child, th:first-child { text-align: left; font-weight: 500; }
  tr:hover td { background: #1a1a1a; }
  .empty { color: #555; }
  .footer { margin-top: 1rem; font-size: 0.7rem; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<header>
  <div>
    <h1>財務總覽</h1>
    <div class="status" id="status">載入中…</div>
  </div>
  <div class="controls">
    <select id="yearSelect">
      <option value="2025">2025</option>
      <option value="2026" selected>2026</option>
      <option value="2027">2027</option>
    </select>
    <label style="font-size:0.8rem;color:var(--muted);display:flex;align-items:center;gap:0.25rem">
      <input type="checkbox" id="yoy" checked> 同期比較
    </label>
    <button id="refreshBtn">重新整理</button>
    <select id="interval">
      <option value="0">自動：關</option>
      <option value="60" selected>1 分鐘</option>
      <option value="180">3 分鐘</option>
      <option value="300">5 分鐘</option>
    </select>
  </div>
</header>

<div class="kpi-grid" id="kpis"></div>

<div class="charts-grid">
  <div class="panel">
    <h2>收入 / 支出 / 淨利趨勢</h2>
    <canvas id="trendChart"></canvas>
  </div>
  <div class="panel">
    <h2>最新月份支出組成</h2>
    <canvas id="expenseChart"></canvas>
  </div>
</div>

<div class="panel" id="yoyPanel" style="display:none;margin-bottom:1rem">
  <h2>同期比較（與去年同月）</h2>
  <canvas id="yoyChart"></canvas>
</div>

<div class="panel">
  <h2>完整月報表</h2>
  <div class="table-wrap">
    <table id="table"></table>
  </div>
</div>

<div class="footer">資料即時讀取自 Google Sheets</div>

<script>
const SHEET_ID = '1TWQZEsSFx0mI5Srzg7-jGaaP-_jFRHzqeez6gTMF8rU';
let trendChart, expenseChart, yoyChart, refreshTimer;
let callbackId = 0;

function fetchSheetJSONP(sheetName) {
  return new Promise((resolve, reject) => {
    const id = 'cb_' + (++callbackId);
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}&callback=${id}&_=${Date.now()}`;
    window[id] = function(response) {
      delete window[id];
      if (script.parentNode) script.parentNode.removeChild(script);
      if (response && response.table) resolve(response.table);
      else reject(new Error('無資料'));
    };
    const script = document.createElement('script');
    script.src = url;
    script.onerror = () => { delete window[id]; reject(new Error('網路錯誤')); };
    document.head.appendChild(script);
    setTimeout(() => { if (window[id]) { delete window[id]; reject(new Error('逾時')); } }, 12000);
  });
}

function tableToRows(table) {
  const headers = table.cols.map(c => c.label || '');
  const rows = [headers];
  (table.rows || []).forEach(r => {
    const row = (r.c || []).map(cell => cell && cell.v != null ? String(cell.v) : '');
    rows.push(row);
  });
  return rows;
}

async function loadData() {
  const statusEl = document.getElementById('status');
  const year = document.getElementById('yearSelect').value;
  const doYoY = document.getElementById('yoy').checked;
  statusEl.textContent = '正在同步 ' + year + '…';
  statusEl.className = 'status';
  try {
    const table = await fetchSheetJSONP(year);
    const rows = tableToRows(table);
    let prevRows = null;
    if (doYoY) {
      try {
        const prevTable = await fetchSheetJSONP(String(parseInt(year) - 1));
        prevRows = tableToRows(prevTable);
      } catch (_) {}
    }
    render(rows, year, prevRows);
    statusEl.textContent = '已同步 ' + year + ' · ' + new Date().toLocaleTimeString('zh-TW');
    statusEl.className = 'status ok';
  } catch (e) {
    statusEl.textContent = '讀取失敗：' + (e.message || '請稍後再試');
  }
}

function num(v) {
  if (v == null || v === '') return 0;
  const n = parseFloat(String(v).replace(/,/g, ''));
  return isNaN(n) ? 0 : n;
}

function displayCell(v) {
  const n = num(v);
  if (v === '' || v == null || n === 0) return '<span class="empty">—</span>';
  return n.toLocaleString();
}

function render(rows, year, prevRows) {
  const headers = rows[0];
  const idxExp = headers.indexOf('總支出');
  const idxInc = headers.indexOf('總收入');
  const idxNet = headers.indexOf('當月淨利');

  const allMonths = rows.slice(1).filter(r => r[0] && String(r[0]).includes('月'));

  // 當前月份（例如 11月）
  const now = new Date();
  const currentMonthName = (now.getMonth() + 1) + '月';

  // 優先用當前月份，沒有就用最後一個有數字的月份
  let latest = allMonths.find(r => String(r[0]) === currentMonthName);
  if (!latest) {
    const withData = allMonths.filter(r => num(r[idxExp]) !== 0 || num(r[idxInc]) !== 0);
    latest = withData[withData.length - 1] || allMonths[allMonths.length - 1] || [];
  }

  const totalExp = num(latest[idxExp]);
  const totalInc = num(latest[idxInc]);
  const net = num(latest[idxNet]);

  const dataForChart = allMonths.filter(r => num(r[idxExp]) !== 0 || num(r[idxInc]) !== 0);

  let yearExp = 0, yearInc = 0, yearNet = 0;
  dataForChart.forEach(r => {
    yearExp += num(r[idxExp]);
    yearInc += num(r[idxInc]);
    yearNet += num(r[idxNet]);
  });
  const avgExp = dataForChart.length ? Math.round(yearExp / dataForChart.length) : 0;

  let yoyHtml = '';
  if (prevRows) {
    const prevData = prevRows.slice(1).filter(r => r[0] && String(r[0]).includes('月'));
    const prevLatest = prevData.find(r => String(r[0]) === String(latest[0]));
    if (prevLatest) {
      const prevNet = num(prevLatest[idxNet]);
      const diff = net - prevNet;
      const pct = prevNet !== 0 ? ((diff / Math.abs(prevNet)) * 100).toFixed(1) : '-';
      yoyHtml = `<div class="kpi-sub">vs 去年同月 <span class="${diff>=0?'pos':'neg'}">${diff>=0?'+':''}${diff.toLocaleString()} (${pct}%)</span></div>`;
    }
  }

  document.getElementById('kpis').innerHTML = `
    <div class="kpi"><div class="kpi-label">最新月份 (${year})</div><div class="kpi-value">${latest[0] || '—'}</div>${yoyHtml}</div>
    <div class="kpi"><div class="kpi-label">當月收入</div><div class="kpi-value pos">${totalInc.toLocaleString()}</div></div>
    <div class="kpi"><div class="kpi-label">當月支出</div><div class="kpi-value neg">${totalExp.toLocaleString()}</div></div>
    <div class="kpi"><div class="kpi-label">當月淨利</div><div class="kpi-value ${net>=0?'pos':'neg'}">${net.toLocaleString()}</div></div>
    <div class="kpi"><div class="kpi-label">累計淨利</div><div class="kpi-value ${yearNet>=0?'pos':'neg'}">${yearNet.toLocaleString()}</div><div class="kpi-sub">有數字的月份加總</div></div>
    <div class="kpi"><div class="kpi-label">月均支出</div><div class="kpi-value">${avgExp.toLocaleString()}</div></div>
  `;

  const labels = dataForChart.map(r => r[0]);
  const incomes = dataForChart.map(r => num(r[idxInc]));
  const expenses = dataForChart.map(r => num(r[idxExp]));
  const nets = dataForChart.map(r => num(r[idxNet]));

  if (trendChart) trendChart.destroy();
  trendChart = new Chart(document.getElementById('trendChart'), {
    type: 'line',
    data: {
      labels,
      datasets: [
        { label: '收入', data: incomes, borderColor: '#4ade80', backgroundColor: 'rgba(74,222,128,0.05)', tension: 0.3, fill: true, pointRadius: 2 },
        { label: '支出', data: expenses, borderColor: '#f87171', backgroundColor: 'rgba(248,113,113,0.05)', tension: 0.3, fill: true, pointRadius: 2 },
        { label: '淨利', data: nets, borderColor: '#e5e5e5', tension: 0.3, pointRadius: 2 }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { labels: { color: '#f0f0f0', boxWidth: 10 } } },
      scales: {
        x: { ticks: { color: '#777' }, grid: { color: '#1a1a1a' } },
        y: { ticks: { color: '#777' }, grid: { color: '#222' } }
      }
    }
  });

  const expenseCols = ['房贷', '車貸', '借贷', '投资', '管理費', '信用卡花費'];
  const expLabels = [], expValues = [];
  expenseCols.forEach(col => {
    const i = headers.indexOf(col);
    if (i >= 0) {
      const v = num(latest[i]);
      if (v > 0) { expLabels.push(col); expValues.push(v); }
    }
  });

  if (expenseChart) expenseChart.destroy();
  expenseChart = new Chart(document.getElementById('expenseChart'), {
    type: 'doughnut',
    data: {
      labels: expLabels,
      datasets: [{ data: expValues, backgroundColor: ['#f87171','#fb923c','#fbbf24','#4ade80','#a3a3a3','#737373'], borderWidth: 0 }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'right', labels: { color: '#f0f0f0', boxWidth: 10, padding: 8 } } }
    }
  });

  const yoyPanel = document.getElementById('yoyPanel');
  if (prevRows && prevRows.length > 1 && dataForChart.length) {
    yoyPanel.style.display = 'block';
    const prevData = prevRows.slice(1).filter(r => r[0] && String(r[0]).includes('月'));
    const prevNets = labels.map(m => {
      const row = prevData.find(r => String(r[0]) === m);
      return row ? num(row[idxNet]) : 0;
    });
    if (yoyChart) yoyChart.destroy();
    yoyChart = new Chart(document.getElementById('yoyChart'), {
      type: 'bar',
      data: {
        labels,
        datasets: [
          { label: year + ' 淨利', data: nets, backgroundColor: '#e5e5e5' },
          { label: (parseInt(year)-1) + ' 淨利', data: prevNets, backgroundColor: '#555' }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { labels: { color: '#f0f0f0' } } },
        scales: {
          x: { ticks: { color: '#777' }, grid: { display: false } },
          y: { ticks: { color: '#777' }, grid: { color: '#222' } }
        }
      }
    });
  } else {
    yoyPanel.style.display = 'none';
  }

  let html = '<tr>' + headers.map(h => `<th>${h}</th>`).join('') + '</tr>';
  allMonths.forEach(r => {
    html += '<tr>' + r.map((c, i) => {
      if (i === 0) return `<td>${c || ''}</td>`;
      const n = num(c);
      const cls = headers[i] === '當月淨利' ? (n > 0 ? 'pos' : n < 0 ? 'neg' : '') : '';
      return `<td class="${cls}">${displayCell(c)}</td>`;
    }).join('') + '</tr>';
  });
  document.getElementById('table').innerHTML = html;
}

function setAutoRefresh() {
  if (refreshTimer) clearInterval(refreshTimer);
  const sec = parseInt(document.getElementById('interval').value) || 0;
  if (sec > 0) refreshTimer = setInterval(loadData, sec * 1000);
}

document.getElementById('refreshBtn').addEventListener('click', loadData);
document.getElementById('yearSelect').addEventListener('change', loadData);
document.getElementById('yoy').addEventListener('change', loadData);
document.getElementById('interval').addEventListener('change', setAutoRefresh);

loadData();
setAutoRefresh();
</script>
</body>
</html>
